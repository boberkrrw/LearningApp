name: Claude PR Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, synchronize]   # auto-review on every PR

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write   # required for OIDC

jobs:
  claude-pr:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1   # change to your Bedrock region

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          claude_args: "--model eu.anthropic.claude-sonnet-4-6"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number || github.event.issue.number }} in repo ${{ github.repository }}.
            
            Use `git diff origin/master...HEAD` to see the changes.
            
            Focus on:
            - Code correctness and potential bugs
            - Security implications
            - Performance considerations
            - Test coverage
            
            Post your review as a comment on the PR.
