name: Claude PR Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, synchronize]   # auto-review on every PR

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write   # required for OIDC

jobs:
  claude-pr:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1   # change to your Bedrock region

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: "true"
          claude_args: "--model eu.anthropic.claude-sonnet-4-6"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          allowed_tools: "Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Glob,Grep"
          prompt: |
            Review PR #${{ github.event.pull_request.number || github.event.issue.number }} in repo ${{ github.repository }}.
            
            Use `gh pr diff ${{ github.event.pull_request.number || github.event.issue.number }}` to see the changes.
            Then post your review using `gh pr comment ${{ github.event.pull_request.number || github.event.issue.number }} --body "your review"`.
            
            Focus on:
            - Code correctness and potential bugs
            - Security implications
            - Performance considerations
            - Test coverage
